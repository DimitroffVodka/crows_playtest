  description: "<p>When you get a tier 3 result on an attack with this weapon against a creature, the creature gains a bleeding gash. The gash deals 1d6 P damage to a creature at the start of their combat turns. If the target receives magic healing or the gash’s damage result is 6, the gash stops dealing damage to the target. When you get a doom on an attack with the weapon, you get a gash.</p>"

