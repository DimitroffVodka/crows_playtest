  description: "<p>While you wear this armor, you use a maneuver to move up to your speed. While you move, mundane walls and other obstructions can’t hamper your movement. If you end this move inside of a solid object, you are shunted back to the space where you entered it and take 1d6 P damage for each space you are moved through on your way back. This maneuver has a 1 UD that must be rolled after activating the effect. The UD recharge when you finish a rest.</p>"

