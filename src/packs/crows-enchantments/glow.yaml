  description: "<p>While you wear or wield this armor, you can use a maneuver to make it glow, giving off light 5/5. This effect has 2 UD and the UD recharge when you finish a rest. Once you turn this effect on, it can’t be turned off until the UD expire. If you roll a doom while wearing, wielding, or carrying the armor and the light effect is available but hasn’t been turned off, the effect activates.</p>"

