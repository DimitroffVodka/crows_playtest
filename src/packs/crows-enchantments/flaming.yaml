  description: "<p>As a maneuver while wielding this weapon, you can command it to ignite in a magical fire that gives the weapon a +2 damage bonus and causes it to shed light 5/5. You can use another maneuver to extinguish the flames. When you get a doom on an attack with this weapon, you take 1d10 damage as the weapon suddenly bursts with flame and then its fire goes out and you can’t ignite it again until the end of the DT.</p>"

