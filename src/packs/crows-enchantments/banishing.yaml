  description: "<p>When a creature hits you with a melee attack while you wear or wield this armor, you can use a reaction to push them 1d6 squares. If a creature gets a crit on a melee attack against you while you wear or wield this armor, you fly vertically up 1d6 × 10 feet and then fall and can’t use your reaction to activate this armor in response to the attack.</p>"

