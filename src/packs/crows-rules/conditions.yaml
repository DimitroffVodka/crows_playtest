      content: |
        <h2>Crafting</h2>
        <p>While you rest or are in town, you can use to craft new equipment.</p>
        <h3>Crafting Prerequisites</h3>
        <p>You must meet an item's prerequisites to craft it.</p>
        <ul>
          <li><strong>Expertise:</strong> Every craftable item has an expertise and number of uses associated with it. You must have the appropriate expertise and number of uses to craft it. This prerequisite is on the item's card.</li>
          <li><strong>Materials:</strong> Every craftable item requires raw materials. This prerequisite is on the item's card.</li>
          <li><strong>Tools:</strong> See below.</li>
        </ul>
        <h4>Tools</h4>
        <p>The tools you need to craft an item are based on the expertise needed to craft the item.</p>
        <ul>
          <li><strong>Alchemy:</strong> Alchemist's tools</li>
          <li><strong>Blacksmithing:</strong> Blacksmith's tools</li>
          <li><strong>Enchanting:</strong> Enchanter's tools</li>
        </ul>
        <h3>Harvesting Materials</h3>
        <p>Some crafting materials must be harvested from a monster corpse with the Harvest rest activity. The parts are monster organs and vials of blood collected from a corpse.</p>
        <h3>Crafting Goal</h3>
        <p>Each craftable item has a crafting goal, a special number, listed on its card. The higher the number, the longer it takes to make the item.</p>
        <h3>Crafting Rolls</h3>
        <p>You can take the Craft Equipment rest activity to craft a piece of equipment you meet the prerequisites for. When you do, you make a crafting roll when you finish the rest.</p>
        <p>A crafting roll is a special Mind test and doesn't have tiered outcomes. Instead, you calculate the total and record the result. When you make a crafting roll, the total—no matter how low—becomes crafting points that are accrued by the item you're creating. Even if you have a bane or penalty on a crafting roll, the minimum total for the roll is 1, unless you get a doom result. If you get a doom result on a crafting roll, you accrue no new points for the item. If you obtain a crit on a crafting roll, you can make another crafting roll for the same item as part of the same rest activity.</p>
        <p>When you apply a double edge or an expertise to a crafting roll, the roll gains a +4 bonus instead of the normal benefits. You can only apply up to two expertises per crafting roll. When a double bane applies to a crafting roll, the roll gains a -4 penalty.</p>
        <p>When all of an item's crafting points equal or are greater than its crafting goal, the item is complete and the materials used to create it are expended.</p>
        <h4>Crafting Multiple Items</h4>
        <p>If you roll high enough to finish crafting an item, you can use any surplus points to begin crafting another version of the same item, provided you have the materials. If you have enough surplus points to craft a second item, then you can begin crafting a third, and so on.</p>
        <h4>Multiple Crafters</h4>
        <p>If an creature taking a rest with you meets the tool and expertise prerequisites for an item you are crafting with the Craft Equipment activity, they can use their rest activity to undertake the task with you. Crafting rolls they make as part of this rest activity are accrued by the item as points.</p>
        <h3>IDing Magic Items</h3>
        <p>When you encounter an unfamiliar magic item, you don't know automatically know its properties, but you can tell that it is magical, as all such items vibrate with power. To discover an item's properties, you can ask an NPC who has expertise with the item, such as asking an alchemist about a potion, or use the Identify Item rest activity during a rest. You could attempt to activate the item and see what happens. If the item is a liquid in a vial, you might drink it or pour it out on the ground to observe any effect. If it's a sword, you might swing it at a foe and see what happens. This method could waste a consumable item or have disastrous effects if the item is cursed or not fit for human consumption.</p>
        <p>If you want to identify a magic item you hold, you can also make the following test:</p>
        <p><strong>2d10 + M</strong></p>
        <ul>
          <li><strong>Tier 1:</strong> You accidentally activate the item in a harmful way determined by the Ref.</li>
          <li><strong>Tier 2:</strong> You learn nothing about the item.</li>
          <li><strong>Tier 3:</strong> You learn all of the item's properties.</li>
        </ul>
        <p>You can only make this test once with an item.</p>
