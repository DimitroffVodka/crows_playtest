    name: Crafting
    type: text
    text:
      content: |
        <h2>Crafting</h2>
        <p>While you rest or are in town, you can use to craft new equipment.</p>
        <h3>Crafting Prerequisites</h3>
        <ul>
          <li><strong>Skill:</strong> Every craftable item has a skill and bonus associated with it. You must have the appropriate skill bonus in the prerequisite skill to craft it.</li>
          <li><strong>Materials:</strong> Every craftable item requires raw materials listed on the item's card.</li>
          <li><strong>Recipe:</strong> Every craftable item has a document of instructions to follow for crafting it. If you skill bonus in the prerequisite skill is higher than the item's prerequisite bonus, then you don't need a recipe to craft it.</li>
          <li><strong>Tools:</strong>
            <ul>
              <li>Alchemy: Alchemist's tools</li>
              <li>Blacksmithing: Blacksmith's tools</li>
              <li>Enchanting: Enchanter's tools</li>
            </ul>
          </li>
        </ul>
        <h3>Crafting Goal &amp; Rolls</h3>
        <p>Each craftable item has a crafting goal — a special number listed on its card. The higher the number, the longer it takes to make the item.</p>
        <p>You can take the Craft Equipment rest activity to craft a piece of equipment you meet the prerequisites for. When you do, you make a crafting roll when you finish the rest. A crafting roll is a special Mind test that uses the item's prerequisite skill and doesn't have tiered outcomes — you calculate the total and record the result. When you make a crafting roll, the total — no matter how low — becomes crafting points that are accrued by the item you're creating. Even if you have a penalty on a crafting roll, the minimum total for the roll is 1, unless you get a doom result. If you get a doom result on a crafting roll, you accrue no new points for the item. If you obtain a crit on a crafting roll, you can make another crafting roll for the same item as part of the same rest activity.</p>
        <p>When all of an item's crafting points equal or are greater than its crafting goal, the item is complete and the materials used to create it are expended.</p>
        <h3>Multiple Crafters</h3>
        <p>If another creature taking a rest with you meets the tool and skill prerequisites for an item you are crafting with the Craft Equipment activity, they can use their rest activity to undertake the task with you. Crafting rolls they make as part of this rest activity are accrued by the item as points.</p>
        <h3>Harvesting Materials</h3>
        <p>Some crafting materials must be harvested from a monster corpse with the Harvest rest activity. Each corpse can only provide 1 of a specific body part, such as blood, heart, or hide. You can only harvest 1 body part per rest activity, though multiple PCs can harvest body parts from the same corpse during a rest. Monster blood and organs are Tiny objects. Monster hides are one size smaller than the creature they come from.</p>
        <h3>Identifying Magic Items</h3>
        <p>When you encounter an unfamiliar magic item, you don't know automatically know its properties, but you can tell that it is magical. To discover an item's properties, you can ask an NPC who has expertise with the item, use the Identify Item rest activity, or attempt to activate it and observe the effects.</p>
        <p>You can also make the following test to identify a magic item you hold (<strong>2d10 + M</strong>):</p>
        <ul>
          <li>Tier 1: You accidentally activate the item in a harmful way determined by the Ref.</li>
          <li>Tier 2: You learn nothing about the item.</li>
          <li>Tier 3: You learn all of the item's properties.</li>
        </ul>
        <p>You can only make this test once with an item.</p>
