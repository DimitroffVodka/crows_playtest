  type: 0
  text: Camping | The travelers are camping when the PCs come upon them. The NPCs
    welcome the crows with caution. If the PCs are friendly, they offer to share their
    meal, and the PCs don’t need to eat rations when they next rest. If the PCs are
    standoffish or suspicious, the NPCs ask them to leave, attacking or fleeing if
    the PCs refuse.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 3
  - 3
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res4fecd029604b2
  _key: '!tables.results!crowsrte2ff6ac38.res4fecd029604b2'
  type: 0
  text: 'Crows | These travelers are another group of crows on their way to a nearby
    dungeon. Roll 1d6: On a 1–2, the NPCs invite the PCs to come with them and raid
    a dungeon together. On a 3–4, the crows are standoffish, suspecting the PCs of
    foul play. If the PCs show kindness, the NPCs share helpful lore about a nearby
    POI or dungeon. On a 5–6, the NPCs view the PCs as business rivals and make plans
    to kill them and take their stuff.'
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 4
  - 4
  drawn: false
  documentCollection: ''
  documentId: null
