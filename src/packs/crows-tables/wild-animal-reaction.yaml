  documentId: null
- _id: resc1f679d3a1392
  _key: '!tables.results!crowsrtd4f7e669d.resc1f679d3a1392'
  type: 0
  text: Frightened | Frightened animals freeze and stare at the PCs, sizing them up.
    If approached with anything other than the utmost calm and caution, the animal
    either flees (if they are clearly no match for the PCs and have a way out) or
    fights until the PCs flee (if they have a chance against the PCs or are cornered).
    The Ref can allow a Mind test with the Handle Pet expertise to attempt to turn
    the animal’s attitude to curious.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 26
  - 35
  drawn: false
  documentCollection: ''
  documentId: null
- _id: resaf693ccd89191
  _key: '!tables.results!crowsrtd4f7e669d.resaf693ccd89191'
  type: 0
  text: Hungry | Hungry animals approach when the PCs are eating, drawn by the smell
    of food. If given at least 1 ration’s worth of food, the animal becomes friendly.
    If the PCs don’t share their food, the animal attacks, attempting to get some
    food and run off with it.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 36
  - 45
  drawn: false
  documentCollection: ''
  documentId: null
