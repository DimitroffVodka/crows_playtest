  text: Friendly | A friendly animal happily follows the PCs around for an hour, and
    a PC can make a test to become the animal’s owner (see Pets in Characters). If
    the PCs are mean or aggressive to the animal they flee.
  img: icons/svg/d20-black.svg
  weight: 1
