  type: 0
  text: Stalking | Stalking animals attempt to stalk the PCs from hidden positions.
    They follow the group until one or two PCs are alone and then pounce. It may be
    that they view the PCs as a threat or food or both.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 66
  - 70
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res9d5846b04a4a6
  _key: '!tables.results!crowsrtd4f7e669d.res9d5846b04a4a6'
  type: 0
  text: Starved | A starved animal is desperate for food, and the PCs have something
    (or are something) they want to eat. The skinny animal approaches the PCs while
    displaying aggressive behavior. The animal attacks unless given a day’s worth
    of food based on their size, at which point they gobble up the food then flee.
    If the animal is carnivorous, they may attempt to kill a PC and carry their body
    off if not fed.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 71
  - 80
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res095e9366ab13b
  _key: '!tables.results!crowsrtd4f7e669d.res095e9366ab13b'
  type: 0
  text: Territorial | Territorial animals don’t want the PCs invading their home.
    The animals follow the PCs, displaying signs of aggression and never getting too
    close. As long as the PCs keep moving through the area the animals stop pursuing
    them when they exit the hex where the encounter first occurs. Otherwise, the animals
    attack and fight to the death.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 81
  - 90
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res012472eae6cca
  _key: '!tables.results!crowsrtd4f7e669d.res012472eae6cca'
  type: 0
  text: Treasure-Seeking | Treasure-seeking animals approach when a PC wears or holds
    an item that attracts the animal. It’s often something shiny or that looks like
    their food. The animal makes their interest in the item clear and if the PC doesn’t
    give it to them, the animal attacks.
  img: icons/svg/d20-black.svg
  weight: 1
