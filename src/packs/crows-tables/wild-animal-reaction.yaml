  text: Playful | Playful animals want to catch sticks, be chased, give a ride, wrestle,
    or otherwise engage in fun with the PCs. They approach in an energetic manner,
    playing with other animals of their type if any are nearby. If the PCs engage
    in play with the animal, they become friendly. If not, the animal becomes violent.
  img: icons/svg/d20-black.svg
