  text: Curious | The animal is curious about what the PCs are and approaches them
    cautiously but openly. Any aggressive or boisterous behavior causes the animal
    to become frightened. Calm behavior causes the animal to investigate for a few
    moments then leave. Generous behavior, such as sharing food with the animal, makes
    them friendly.
