  type: 0
  text: 'Protective | A protective animal is guarding something and attacks any creature
    they notice who attempts to get it. These animals stand their ground and fight
    to the death. Roll any die: On an even result, the animal is defending a nest
    that has 1d10 babies or eggs (or egg sacks), which can be sold to a village’s
    stables (each as if it were an individual pet). Otherwise the animal protects
    one thing on the Minor Interesting Things table.'
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 56
  - 65
  drawn: false
  documentCollection: ''
  documentId: null
