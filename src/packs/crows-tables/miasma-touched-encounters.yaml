  type: 0
  text: Sluggish | The humans beg the PCs for help, claiming to be lost and trying
    to find civilization. In truth, they have no destination in mind and wander the
    wild in a haze, caring only for themselves and no others. If the PCs agree to
    take them on, they slow the group’s travel by 1 hex each day. The NPCs leave happily
    when a village is reached, turning off into the wilds again. If abandoned after
    agreeing to travel together, the next encounter while outdoors the PCs get is
    these humans ambushing them for revenge.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 73
  - 76
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res6c87518b9a225
  _key: '!tables.results!crowsrtd3ffe74d9.res6c87518b9a225'
  type: 0
  text: Suspicious | The humans are friendly at first, but quickly become suspicious
    of everything the PCs say and do. They believe the PCs have ill intentions, and
    quickly try to get a move on. If the PCs are clearly stronger, the NPCs flee quickly
    and prepare a guarded camp. If the NPCs believe they can overtake the PCs, they
    follow with a plan to ambush their camp later to wipe their evil from the world.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 77
  - 80
  drawn: false
  documentCollection: ''
  documentId: null
- _id: resf26d04c3b65bc
  _key: '!tables.results!crowsrtd3ffe74d9.resf26d04c3b65bc'
  type: 0
  text: Thieves | The humans attempt to befriend the PCs while eyeing up their possessions.
    When an opportunity arises, they attempt to flee with one or more of the PCs'
    most valuable items.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 81
  - 84
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res55d0ac3914d71
