  type: 0
  text: Tyrant | One of the humans in this group is a leader whom the others worship
    as a tyrant. This NPC demands fealty from all they meet. Those who do not bow
    and call them their leader are captured and killed. Those who swear fealty are
    given a blessing and asked if they wish to join the company or start their own
    in the name of the tyrant. Should the PCs agree to serve the leader separately,
    the next time you roll this encounter, they meet the same group, who demands a
    satisfactory progress update.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 85
  - 88
  drawn: false
  documentCollection: ''
  documentId: null
