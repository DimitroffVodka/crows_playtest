  type: 0
  text: Cannibals | These humans want to eat the PCs. If they outnumber the PCs, they
    set an ambush and attack. Otherwise, they approach as fellow travelers (perhaps
    as merchants or crows from another village), and then wait until the PCs are sleeping
    or in a bad spot and then attack. If they can take just one PC to eat, that’s
    a victory to them.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 11
  - 14
  drawn: false
  documentCollection: ''
  documentId: null
- _id: resfdf11d1b4eaee
  _key: '!tables.results!crowsrtd3ffe74d9.resfdf11d1b4eaee'
  type: 0
  text: Competitive | The humans want to prove they are better than the PCs at something.
    It could be strength of arms, a foot race, or a trivia contest, whatever the PCs
    excel in. They challenge the PCs to the contest, making a wager on it. The winner
    can take any item from the loser. This is negotiable, as the NPCs mainly want
    to prove their superiority. If the PCs agree and lose or win graciously, the NPCs
    take their winnings and leave. If the PCs disagree or win and rub it in the face
    of the NPCs, the NPCs attack.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 15
  - 18
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res6b2cfefd15680
  _key: '!tables.results!crowsrtd3ffe74d9.res6b2cfefd15680'
  type: 0
  text: Cruel | The NPCs revel in cruelty for the sake of it. When the PCs find them,
    there is a 50% chance that the NPCs have captured an animal, human, or monster
    of your choice and debate how to make the creature suffer. If not, they approach
    the PCs as friendly, planning to kidnap one of them when the moment presents itself.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 19
  - 22
  drawn: false
  documentCollection: ''
  documentId: null
- _id: resc33fd0d67dee3
  _key: '!tables.results!crowsrtd3ffe74d9.resc33fd0d67dee3'
  type: 0
  text: Cultists | The NPCs are a cult of a Necromancer of your choice. They are willing
    to trade anything in their possession or perform favors for necromancy spellbooks.
    They attempt to convert the PCs, and attack any who have stolen from or spoken
    ill of their Necromancer or their creations.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 23
  - 32
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res28d81876fe66c
  _key: '!tables.results!crowsrtd3ffe74d9.res28d81876fe66c'
  type: 0
  text: Death to the Gods | The humans hate all religion. They rant and rave about
    the gods abandoning the world. If any PCs disagree or openly wear or carry religious
    material, the NPCs wait for an opportune moment to attack that PC. If the PCs
    agree, the NPCs are pleased, and can be convinced to offer some assistance, though
    they won’t travel into town.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 33
  - 36
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res997cecf74929f
  _key: '!tables.results!crowsrtd3ffe74d9.res997cecf74929f'
  type: 0
  text: Deceitful | These humans enjoy deceiving others. When they meet the PCs, they
    make up fanciful tales about encounters they’ve had with nearby monsters, dungeons,
    villages, and landmarks. None of what they claim is true. If the PCs believe them,
    the NPCs attempt to lure them into a trap, where monsters, animals, or some other
    misfortune harms the PCs. If the NPCs are accused of lying, they attack if they
    believe they can kill the PCs, otherwise playing it off as a joke and fleeing.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 37
  - 40
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res95a725a75e419
  _key: '!tables.results!crowsrtd3ffe74d9.res95a725a75e419'
  type: 0
  text: Despondent | The humans trudge through the world, crying and upset. Nothing
    matters to them, though they will defend themselves if threatened. They also lash
    out at any other person who tries to comfort or bolster them, first verbally,
    then physically.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 41
  - 44
  drawn: false
  documentCollection: ''
  documentId: null
- _id: resb4356f7d1a657
  _key: '!tables.results!crowsrtd3ffe74d9.resb4356f7d1a657'
  type: 0
  text: Destructive | The humans just want to break something ... or someone. The
    NPCs simmer with rage and are confrontational and insulting, trying to bait the
    PCs into a fight. If the PCs agree with the NPCs and give their anger a direction
    at something or someone nearby, the PCs happily go off to destroy the thing. Otherwise
    they battle the PCs, hoping to kill or maim someone before running off.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 45
  - 48
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res3b49c44cdbe44
  _key: '!tables.results!crowsrtd3ffe74d9.res3b49c44cdbe44'
  type: 0
  text: False Bravado | The humans claim to be brave crows looking for treasure and
    adventure. They invite the PCs to come with them to confront monsters guarding
    a den of treasure. Together, they can defeat the threat and split the gold. Too
    bad these NPC cowards run off when any sort of fight starts.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 49
  - 52
  drawn: false
  documentCollection: ''
  documentId: null
- _id: resbf8b913aed3cf
  _key: '!tables.results!crowsrtd3ffe74d9.resbf8b913aed3cf'
  type: 0
  text: Greedy | The humans want whatever they can get their hands on for as little
    work as possible. They want food, shelter, supplies, and treasure. If the PCs
    outmatch them, they appear as beggars in need. If the PCs seem like they can be
    bullied, the NPCs approach as bandits.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 53
  - 56
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res6fd1e27aeccc9
  _key: '!tables.results!crowsrtd3ffe74d9.res6fd1e27aeccc9'
  type: 0
  text: Knowledge Seeker | The humans believe knowledge is power, and they want books
    of lore and conversations with experts. They stop the PCs, asking to talk to them,
    peppering them with questions about lore until they are gifted a lore book, the
    day is done (cutting the PCs’ travel short), or the PCs try to leave, at which
    point the NPCs attack, planning to kidnap the most knowledgeable among them and
    force them into giving days of lectures.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 57
  - 60
  drawn: false
  documentCollection: ''
  documentId: null
- _id: res59e9727e2759d
  _key: '!tables.results!crowsrtd3ffe74d9.res59e9727e2759d'
  type: 0
  text: Mage Hunter | The humans don’t trust mages, except for those among them who
    became mages only to hunt others. They attempt to separate and ambush any PCs
    openly carrying spellbooks. If none do, the NPCs approach and ask if the PCs know
    where to find any mages, revealing themselves as mage hunters if the PCs reveal
    themselves or anyone nearby as a magic user. Their aim is to kill magic users,
    claim their spellbooks, and leave.
  img: icons/svg/d20-black.svg
  weight: 1
  range:
  - 61
  - 64
  drawn: false
  documentCollection: ''
  documentId: null
