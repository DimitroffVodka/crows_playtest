  text: Monster Hatred | The humans hate a specific type of monster that lives in
    a dungeon or POI nearby. They ask the PCs to accompany them to the area and help
    kill the monsters. As soon as they encounter such creatures, the NPCs rush in,
    eager to kill with no plan and no regard for their own or the PCs’ safety.
  img: icons/svg/d20-black.svg
