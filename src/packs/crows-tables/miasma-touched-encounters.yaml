  type: 0
  text: Monster Obsessed | The humans love a specific type of monster that lives in
    a dungeon or POI nearby. They try to tempt the PCs into entering the place with
    rumors of treasure or cries of help. The NPCs have rigged the place with bear
    traps and watch their favorite monsters eat if the PCs enter.
  img: icons/svg/d20-black.svg
