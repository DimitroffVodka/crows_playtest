  text: Wicked Crows | These humans are crows like the PCs, but they have been corrupted
    by the Miasma. They ask to journey with the PCs to a dungeon and split the profits.
    Once inside, these crows work together to use the horrors of the dungeon to systematically
    eliminate the PCs one by one.
  img: icons/svg/d20-black.svg
