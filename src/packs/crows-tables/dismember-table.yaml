# WHY. This is a rules instrument used after a Dismember weapon crit, not a
# generic injury table. The former 1d10 Eye/Ear/Nose/Finger rows came from a
# different table and could not be repaired by changing the die alone.
#
# SOURCE. C:1965-1974 is transcribed as four rows (1-2, 3-4, 5, and 6), with
# the book's anatomy footnote kept in the table description below. REJECTED:
# preserving the old ten result IDs or splitting the book's ranges into six
# rows would make the shipped instrument less faithful and needlessly change
# the printed choices. The first four existing result IDs are retained so
# references to this table's result documents remain stable where possible.
#
# FOUNDRY V14 CAVEAT. TableResult renders `name` and uses the inclusive `range`
# pair; keep the rule text in `name`, not the removed `text` field, and make the
# ranges contiguous so every 1d6 result resolves exactly once.
_id: crowsrtf6fdcf8fc
_key: '!tables!crowsrtf6fdcf8fc'
name: Dismember Table
img: icons/svg/bones.svg
description: <p>Determines permanent injury and loss of body parts when an attack
  dismembers a target.</p><p><em>*Some creatures have only legs. Others have limbs
  that serve as both arms and legs. When you remove a limb from such a creature,
  the Ref determines which effects on the table are appropriate, combining or
  adjusting as they see fit. If a creature doesn’t have discernible anatomy, you
  instead deal twice as much damage against them as you normally would with a crit
  rather than dismembering them.</em></p>
formula: 1d6
replacement: true
displayRoll: true
results:
- _id: resf1ec0b134afa6
  _key: '!tables.results!crowsrtf6fdcf8fc.resf1ec0b134afa6'
  type: 0
  name: 'Arm: The attacker chooses which arm is removed. Any object held in the arm
    is dropped and any creature grabbed by the arm is no longer grabbed. If the
    creature uses the arm as part of a natural weapon attack (such as with claws)
    the attack takes a -1 damage penalty. If the creature has no arms remaining,
    they can’t make any attacks or complete tasks that require arms.'
  img: icons/svg/d20-black.svg
