<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Shadows & Lighting -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Floor Patterns -->
    <pattern id="flagstone" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="#2b2826"/>
      <path d="M 0,0 L 50,0 M 0,25 L 50,25 M 0,50 L 50,50 M 25,0 L 25,25 M 0,25 L 0,50 M 50,25 L 50,50 M 12.5,25 L 12.5,50 M 37.5,0 L 37.5,25" 
            stroke="#1a1817" stroke-width="2" fill="none" opacity="0.4"/>
      <rect x="2" y="2" width="21" height="21" fill="#383431" rx="2" opacity="0.3"/>
      <rect x="27" y="27" width="21" height="21" fill="#22201e" rx="2" opacity="0.4"/>
    </pattern>

    <pattern id="wood-floor" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#422c1b"/>
      <line x1="0" y1="0" x2="60" y2="0" stroke="#2b1a0e" stroke-width="2"/>
      <line x1="0" y1="15" x2="60" y2="15" stroke="#2b1a0e" stroke-width="2"/>
      <line x1="0" y1="30" x2="60" y2="30" stroke="#2b1a0e" stroke-width="2"/>
      <line x1="30" y1="0" x2="30" y2="15" stroke="#2b1a0e" stroke-width="1.5"/>
      <line x1="15" y1="15" x2="15" y2="30" stroke="#2b1a0e" stroke-width="1.5"/>
      <line x1="45" y1="15" x2="45" y2="30" stroke="#2b1a0e" stroke-width="1.5"/>
    </pattern>

    <pattern id="temple-tiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#333036"/>
      <path d="M 0,0 L 40,40 M 40,0 L 0,40" stroke="#221f24" stroke-width="1.5"/>
      <rect x="10" y="10" width="20" height="20" fill="#3d3942" stroke="#221f24" stroke-width="1"/>
    </pattern>

    <pattern id="dirt-straw" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#36291a"/>
      <line x1="5" y1="8" x2="18" y2="12" stroke="#826636" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="22" y1="25" x2="35" y2="28" stroke="#826636" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="32" x2="25" y2="30" stroke="#634d26" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="28" y1="8" x2="36" y2="15" stroke="#634d26" stroke-width="1.5" stroke-linecap="round"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="iron-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e747a"/>
      <stop offset="50%" stop-color="#464a4e"/>
      <stop offset="100%" stop-color="#2a2d30"/>
    </linearGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#c99e32"/>
      <stop offset="100%" stop-color="#7a5d14"/>
    </linearGradient>
    <linearGradient id="wood-grain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#543821"/>
      <stop offset="50%" stop-color="#694629"/>
      <stop offset="100%" stop-color="#432c1a"/>
    </linearGradient>
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a5c6e"/>
      <stop offset="100%" stop-color="#14313b"/>
    </linearGradient>
    <linearGradient id="holy-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48a9c5"/>
      <stop offset="100%" stop-color="#1c5566"/>
    </linearGradient>

    <!-- Ambient Gradients -->
    <radialGradient id="fire-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7a8"/>
      <stop offset="30%" stop-color="#ff8c1a"/>
      <stop offset="70%" stop-color="#cc2900"/>
      <stop offset="100%" stop-color="#400a00"/>
    </radialGradient>
    <radialGradient id="arcane-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c3e8ff"/>
      <stop offset="40%" stop-color="#63a4ff"/>
      <stop offset="75%" stop-color="#4d32a8"/>
      <stop offset="100%" stop-color="#130830"/>
    </radialGradient>
  </defs>

  <!-- Outdoor Ground -->
  <rect width="500" height="500" fill="#141312"/>

  
  <!-- Interior Floor (Circular Tower Interior) -->
  <rect x="60" y="60" width="380" height="380" fill="url(#flagstone)" rx="6"/>

  <!-- Thick Circular Stone Bastion Interior -->
  <circle cx="250" cy="250" r="185" fill="#383430" stroke="#1c1a18" stroke-width="6"/>
  <circle cx="250" cy="250" r="170" fill="url(#flagstone)" stroke="#262320" stroke-width="3"/>

  <!-- Giant Center Spiral Staircase (Leading up to Beacon Flame) -->
  <g filter="url(#drop-shadow)">
    <circle cx="250" cy="250" r="60" fill="#4d4742" stroke="#1f1c1a" stroke-width="4"/>
    <circle cx="250" cy="250" r="15" fill="#24211e" stroke="#111" stroke-width="3"/>
    <!-- Stair Treads Radials -->
    <line x1="250" y1="190" x2="250" y2="235" stroke="#1f1c1a" stroke-width="2.5"/>
    <line x1="292" y1="208" x2="260" y2="239" stroke="#1f1c1a" stroke-width="2.5"/>
    <line x1="310" y1="250" x2="265" y2="250" stroke="#1f1c1a" stroke-width="2.5"/>
    <line x1="292" y1="292" x2="260" y2="261" stroke="#1f1c1a" stroke-width="2.5"/>
    <line x1="250" y1="310" x2="250" y2="265" stroke="#1f1c1a" stroke-width="2.5"/>
    <line x1="208" y1="292" x2="240" y2="261" stroke="#1f1c1a" stroke-width="2.5"/>
    <line x1="190" y1="250" x2="235" y2="250" stroke="#1f1c1a" stroke-width="2.5"/>
    <line x1="208" y1="208" x2="240" y2="239" stroke="#1f1c1a" stroke-width="2.5"/>
  </g>

  <!-- Heavy Oil Tanks & Fuel Storage (West) -->
  <g filter="url(#drop-shadow)">
    <rect x="95" y="160" width="40" height="70" rx="6" fill="url(#iron-metal)" stroke="#111" stroke-width="2.5"/>
    <circle cx="115" cy="180" r="8" fill="url(#gold-metal)" stroke="#222"/>
    <rect x="95" y="245" width="40" height="70" rx="6" fill="url(#iron-metal)" stroke="#111" stroke-width="2.5"/>
    <circle cx="115" cy="265" r="8" fill="url(#gold-metal)" stroke="#222"/>
    <!-- Connecting pipes -->
    <path d="M 135,195 L 180,195 L 180,240" stroke="#333" stroke-width="4" fill="none"/>
  </g>

  <!-- Wood Log Racks & Fuel Bins (North-East) -->
  <g filter="url(#drop-shadow)">
    <rect x="315" y="125" width="60" height="35" rx="2" fill="url(#wood-grain)" stroke="#222" stroke-width="2"/>
    <circle cx="330" cy="138" r="5" fill="#8c582d"/>
    <circle cx="345" cy="138" r="5" fill="#8c582d"/>
    <circle cx="360" cy="138" r="5" fill="#8c582d"/>
    <circle cx="337" cy="148" r="5" fill="#8c582d"/>
    <circle cx="352" cy="148" r="5" fill="#8c582d"/>
  </g>

  <!-- Beacon Keeper Station / Control Desk (South-East) -->
  <g filter="url(#drop-shadow)">
    <rect x="305" y="300" width="65" height="40" rx="3" fill="url(#wood-grain)" stroke="#23170e" stroke-width="2.5"/>
    <circle cx="285" cy="320" r="10" fill="#523924" stroke="#23170e" stroke-width="2"/> <!-- Stool -->
    <!-- Logbook & Lantern on desk -->
    <rect x="325" y="310" width="18" height="14" fill="#d9c398" stroke="#333"/>
    <circle cx="352" cy="318" r="5" fill="#ffd15c" filter="url(#soft-glow)"/>
  </g>

  <!-- Magic Starter Brazier (North) -->
  <g filter="url(#drop-shadow)">
    <circle cx="250" cy="110" r="18" fill="url(#iron-metal)" stroke="#111" stroke-width="2"/>
    <circle cx="250" cy="110" r="12" fill="url(#fire-glow)" filter="url(#soft-glow)"/>
  </g>

  <!-- Doorway (South) -->
  <g filter="url(#drop-shadow)">
    <rect x="210" y="420" width="80" height="25" fill="#262422" stroke="#151413" stroke-width="2"/>
    <rect x="210" y="380" width="8" height="45" rx="1" fill="#523218" stroke="#1a0f07" stroke-width="2" transform="rotate(-15 210 425)"/>
    <rect x="282" y="380" width="8" height="45" rx="1" fill="#523218" stroke="#1a0f07" stroke-width="2" transform="rotate(15 282 425)"/>
  </g>

  <!-- Ambient Light Overlay -->
  <radialGradient id="beacon-amb" cx="250" cy="250" r="220" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#ff9436" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <rect x="60" y="60" width="380" height="380" fill="url(#beacon-amb)" pointer-events="none"/>


  <!-- Header Plaque -->
  <g filter="url(#drop-shadow)" transform="translate(150.0, 15)">
    <rect width="200" height="26" rx="4" fill="#1e1c1a" stroke="#8c6d3f" stroke-width="2"/>
    <text x="100" y="17" fill="#d9c398" font-family="'Cinzel', 'Georgia', serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">THE BEACON</text>
  </g>
</svg>