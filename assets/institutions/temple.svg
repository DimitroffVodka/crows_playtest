  <title id="title">Temple institution — Default village style</title>
  <desc id="desc">Near-orthographic exterior map asset for the Temple institution.</desc>
  <!-- Native vector artwork only: no embedded or linked raster content. -->

  <defs>
    <pattern id="roofHatch" width="12" height="12" patternUnits="userSpaceOnUse">
