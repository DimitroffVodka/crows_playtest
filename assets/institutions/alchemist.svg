<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="title desc">
  <title id="title">Alchemist institution — Default village style</title>
  <desc id="desc">Near-orthographic exterior map asset for the Alchemist institution.</desc>
  <!-- Native vector artwork only: no embedded or linked raster content. -->

  <defs>
    <pattern id="roofHatch" width="12" height="12" patternUnits="userSpaceOnUse">
