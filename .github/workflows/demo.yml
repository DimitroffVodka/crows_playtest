name: Village generator demo

# Publishes docs/../demo as a GitHub Pages site.
#
# The site is assembled rather than served straight from the repo so the demo is
# the only thing published, and so its layout stays identical to the repo's:
# `demo/main.mjs` imports `../module/helpers/...` and `../assets/...`, and those
# same relative paths have to resolve both here and under a plain
# `python3 -m http.server` at the repo root. Nothing is bundled or copied into
# `demo/` — the page runs the shipped generator modules as they are.

on:
  push:
    branches: [master]
    paths:
      - "demo/**"
      - "module/**"
      - "assets/institutions/**"
      - "assets/rural/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a superseded run has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp -r demo _site/demo
          cp -r module _site/module
          cp -r assets/institutions _site/assets/institutions
          cp -r assets/rural _site/assets/rural
          # Without this Pages runs the files through Jekyll, which ignores
          # directories it does not recognise.
          touch _site/.nojekyll
          # The demo has to stay one level down for `../module` to resolve, so
          # the root redirects instead of holding a second copy of the page.
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<title>Crows Village Generator</title>' \
            '<meta http-equiv="refresh" content="0; url=demo/">' \
            '<link rel="canonical" href="demo/">' \
            '<p><a href="demo/">Village generator</a></p>' \
            > _site/index.html

      # The demo imports these four straight from source. A Foundry global
      # creeping into one of them at load time would break the page and nothing
      # else, so it is checked here rather than discovered in a browser.
      - name: Check the generator loads outside Foundry
        run: |
          node --input-type=module -e '
            const plan = await import("./module/helpers/village-plan.mjs");
            await import("./module/helpers/village-plan-draw.mjs");
            await import("./module/helpers/village-map.mjs");
            await import("./module/helpers/village-stamp-art.mjs");
            const built = plan.buildVillagePlan({
              name: "CI", sceneSeed: "ci", prosperity: 5,
              institutions: [{ id: "a", type: "inn" }]
            });
            if (!built.plots.length) throw new Error("the planner produced no plots");
            console.log(`planned ${built.stats.plots} plots, ${built.stats.streets} streets`);
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
